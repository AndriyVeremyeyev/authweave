spring.application.name=core-api
spring.mvc.problemdetails.enabled=true

spring.datasource.url=${AUTHWEAVE_CORE_DB_URL:jdbc:postgresql://localhost:5432/authweave}
spring.datasource.username=${AUTHWEAVE_CORE_DB_USER:authweave_core_runtime}
spring.datasource.password=${AUTHWEAVE_CORE_DB_PASSWORD:}

spring.flyway.url=${AUTHWEAVE_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/authweave}
spring.flyway.user=${AUTHWEAVE_POSTGRES_ADMIN_USER:authweave_admin}
spring.flyway.password=${AUTHWEAVE_POSTGRES_ADMIN_PASSWORD:}
spring.flyway.default-schema=authweave_migrations
spring.flyway.create-schemas=true

management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
