openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AuthWeave Core API
  version: 1.0.0
  description: >-
    Workspace-scoped assessments and stateless catalog draft validation owned by the deterministic AuthWeave core.
    The local development API refuses to start with a non-loopback server address.
    Every versioned workspace route requires a server-only BFF bearer credential and
    a validated OIDC issuer/subject pair mapped to the requested personal workspace.
    Catalog draft routes remain unauthenticated and local-only, except the scoped
    curator review index, evidence review, bootstrap source review and decision routes.
    Internal synthetic fixture diagnostics and auditability supplement validation
    require the server service credential.
    Do not expose this
    service through a proxy or tunnel; this is not a hosted authentication boundary.
servers:
  - url: http://127.0.0.1:8080
    description: Local Core API
security: []
tags:
  - name: Workspaces
    description: Provisions the workspace boundary used by local development.
  - name: Assessments
    description: Creates, reads and updates identity-architecture assessments.
  - name: Catalog drafts
    description: Validates proposed catalog data locally without approval, publication or network access.
paths:
  /api/v2/workspaces/{workspaceId}/assessments/{assessmentId}/provisioning-lifecycle-preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AssessmentId'
      - $ref: '#/components/parameters/OidcIssuer'
      - $ref: '#/components/parameters/OidcSubject'
    post:
      tags: [Assessments]
      operationId: previewProvisioningLifecycleV2
      summary: Check explicit group delivery and separate offboarding design conditions
      description: >-
        Read-only personal preview against one exact saved assessment version. Explicit
        UNKNOWN, NONE, SCIM_GROUPS or APPLICATION_BRIDGE group strategy; scoped temporary
        declarations only. SCIM Groups requires a SCIM user-lifecycle pattern in this
        design model. A group bridge cannot replace required SCIM. Separate account
        disablement, application-session invalidation and token revocation or bounded
        expiry conditions do not verify actual enforcement. Hard failures retain all
        unknown checks. No query parameters, writes, ranking, vendor facts or readiness
        claims. V1 and existing eligibility, coverage and publication gates are unchanged.
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/provisioning-lifecycle-request.v2.schema.json
      responses:
        '200':
          description: Conditional design checks only; all verification and readiness flags are false
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/provisioning-lifecycle-preview.v2.schema.json
        '400':
          description: Malformed version, design, declaration scope, supplied fields or query
        '401':
          description: Service credential or singular identity assertions missing or invalid
        '403':
          description: Identity does not own the requested workspace
        '404':
          $ref: '#/components/responses/AssessmentNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/provisioning-lifecycle-preview:
    parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/AssessmentId'
      - $ref: '#/components/parameters/OidcIssuer'
      - $ref: '#/components/parameters/OidcSubject'
    post:
      tags: [Assessments]
      operationId: previewProvisioningLifecycleV1
      summary: Compare provisioning design alternatives against exact saved criticalities
      description: >-
        Personal read-only preview; no query parameters. The expected assessment version
        is mandatory. Core derives all SCIM, JIT and group criticalities from the stored
        profile. Missing design declarations remain unknown, foreign-pattern conditions
        are rejected, and JIT cannot replace required SCIM. Required or forbidden groups
        remain unassessed. Pros, tradeoffs and references describe design alternatives,
        not provider support or real lifecycle behavior. No writes, recommendation or
        changes to existing eligibility, impact coverage or publication policy.
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/provisioning-lifecycle-request.v1.schema.json
      responses:
        '200':
          description: Version-bound conditional design results only
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/provisioning-lifecycle-preview.v1.schema.json
        '400':
          description: Malformed version, pattern or declarations, supplied fields or query
        '401':
          description: Service credential or singular identity assertions missing or invalid
        '403':
          description: Identity does not own the requested workspace
        '404':
          $ref: '#/components/responses/AssessmentNotFound'
        '409':
          $ref: '#/components/responses/VersionConflict'
  /internal/v1/catalog-curator/auditability-impact/coverage-preview:
    post:
      operationId: previewAuditabilityImpactCoverage
      summary: Bind exact candidate auditability impact to fresh structural profile coverage
      description: >-
        Current fresh scoped curator assertions are mandatory. Accepts only the same
        exact stored-review references as the conditional impact preview, never drafts,
        evaluatedAt or completeness claims. One repeatable-read snapshot and evaluation
        instant bind both analyses. Only selected auditability dimensions are candidate
        checks; other dimensions remain structural-only and verification gaps remain.
        Returns no source or actor bodies. No durable impact write, evidence promotion,
        publication authority or recommendation; historical preflight contracts remain unchanged.
      tags: [Catalog drafts]
      security:
        - BffServiceToken: []
      parameters:
        - $ref: '#/components/parameters/OidcIssuer'
        - $ref: '#/components/parameters/OidcSubject'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-auditability-impact-request.v1.schema.json
      responses:
        '200':
          description: Fresh incomplete coverage over exact stored candidate reviews; no writes
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-impact-coverage.v1.schema.json
        '400':
          description: Malformed references, supplied fields or query parameters
        '401':
          description: Missing or invalid service credential or singular identity assertions
        '403':
          description: Missing role, wrong project or organization, stale or future authentication
        '404':
          description: Referenced stored review does not exist
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-review-problem.v1.schema.json
        '409':
          description: Foreign hash/base, corrupt review replay or inconsistent coverage binding
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-review-problem.v1.schema.json
        '503':
          description: Core service credential or curator scope is not configured
  /internal/v1/catalog-curator/auditability-impact/preview:
    post:
      tags: [Catalog drafts]
      summary: Compare conditional auditability effects of two exact stored reviews
      operationId: previewAuditabilityCandidateImpact
      security:
        - BffServiceToken: []
      description: >-
        Core-only read-only computation, requiring current fresh scoped curator assertions.
        No query parameters or caller-supplied drafts/evaluation time. Replays both exact
        stored requests and audits in one repeatable-read snapshot. Both must share the
        unchanged base draft; neither is treated as a trusted published baseline.
        Checks all six criteria for all four explicit synthetic profiles and every option.
        Assumes untrusted claims; missing/unknown/stale/future claims and unresolved
        recorded conditions remain indeterminate. Shows human verdicts without changing
        trust or hypothetical outcomes. No report persistence, source fetch, approval,
        publication or changes to existing review/coverage/publication policies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-auditability-impact-request.v1.schema.json
      responses:
        '200':
          description: Fresh conditional comparison; not an eligibility or recommendation result.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-impact.v1.schema.json
        '400':
          description: Malformed references, supplied fields or query parameters.
        '401':
          description: Missing, invalid or duplicated credential or identity assertion.
        '403':
          description: Missing scoped curator role or stale/future authentication assertion.
        '404':
          description: Referenced source review does not exist.
        '409':
          description: Review digest/integrity mismatch or different base drafts.
        '503':
          description: Core service credential or curator scope is not configured.
  /internal/v1/catalog-curator/auditability-reviews:
    post:
      tags: [Catalog drafts]
      summary: Record manual source observations for an exact auditability supplement
      operationId: recordAuditabilitySourceReview
      security:
        - BffServiceToken: []
      description: >-
        Core-only scoped curator workflow. Requires singular validated issuer/subject,
        catalog_curator role, configured project/org and authentication within 15 minutes.
        Accepts no query parameters. Explicit confirmation and one observation per
        recorded fact bind exact base/supplement/target-set hashes. Appends an immutable
        request and mandatory body-free audit atomically; first save is 201, equivalent
        same-actor retry is 200, changed content/actor under that key is 409. Source
        dates and trust never change. No proposal mutation, candidate impact, approval
        or publication; old draft/review/publication policies remain unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-auditability-review-request.v1.schema.json
      responses:
        '201':
          description: Immutable review and audit created. Not provider-fact verification.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-review.v1.schema.json
        '200':
          description: Equivalent exact-key request by the same actor; no new writes.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-review.v1.schema.json
        '400':
          description: Invalid shape, binding, target inventory, confirmation or query parameters.
        '401':
          description: Missing, invalid or duplicated credential or identity assertion.
        '403':
          description: Missing scoped curator role or stale/future authentication assertion.
        '409':
          description: Key bound to different request/actor, or stored integrity replay unavailable.
        '503':
          description: Core service credential or curator scope is not configured.
  /internal/v1/catalog-curator/auditability-reviews/{reviewId}:
    get:
      tags: [Catalog drafts]
      summary: Read an exact auditability source-review receipt with integrity replay
      operationId: getAuditabilitySourceReview
      security:
        - BffServiceToken: []
      description: >-
        Requires the same current scoped curator boundary as the write. Accepts only
        one expectedSha256 query parameter and no body. A repeatable-read snapshot
        bounds request bytes and replays all stored hashes, complete manual targets,
        schema/policy/counts and matching historical audit/actor timing. Missing,
        corrupt or unbound data never falls back to a fresh successful report. Returns
        only a no-store historical receipt, without source/draft bodies or actor identity.
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expectedSha256
          in: query
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Exact historical review receipt; not refreshed evidence or authority.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-review.v1.schema.json
        '400':
          description: Invalid UUID/digest, duplicated/extra query parameters or body.
        '401':
          description: Missing, invalid or duplicated credential or identity assertion.
        '403':
          description: Missing scoped curator role or stale/future authentication assertion.
        '404':
          description: Review not found.
        '409':
          description: Expected digest mismatch or stored integrity replay unavailable.
        '503':
          description: Core service credential or curator scope is not configured.
  /internal/v1/catalog-auditability/drafts/validate:
    post:
      tags: [Catalog drafts]
      summary: Validate an unreviewed auditability supplement against an exact base draft
      operationId: validateCatalogAuditabilityDraft
      security:
        - BffServiceToken: []
      description: >-
        Local-only, stateless validation. Requires the server service credential,
        not curator authority. Accepts no query parameters. The separate supplement
        binds the typed draft v1 content digest and exact option scopes; every base
        option needs an explicit scope, including an empty facts array for unknowns.
        A valid report inventories unreviewed source-review targets, not verified
        facts. Invalid semantic binding yields no partial targets. No source fetch,
        durable source review, candidate impact, approval, writes or publication.
        Existing draft v1, historical receipts and synthetic evidence are unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-auditability-draft-validation-request.v1.schema.json
      responses:
        '200':
          description: Valid or invalid draft report with all authority and readiness claims false.
          headers:
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-draft-validation.v1.schema.json
        '400':
          description: Malformed input, unknown fields, duplicate option or criterion, or query parameters.
        '401':
          description: Missing, invalid or duplicated service credential.
        '503':
          description: Service credential is not configured.
  /internal/v1/catalog-profile-impact/coverage-preflight:
    get:
      tags: [Catalog drafts]
      summary: Inspect profile v6 structural and synthetic auditability coverage
      operationId: getProfileV6CoverageCheck
      description: >-
        Local-only service-credential-protected read accepting no query or body.
        Composes unchanged v5 structural coverage with separately dated synthetic
        auditability regression for all 34 v6 semantic inputs. Rule presence does
        not establish proposed-catalog auditability impact or deployed configuration.
        Exact verification gaps remain explicit; full coverage and authority are false.
        Does not change profiles, evidence dates, historical receipts or publication.
      security:
        - BffServiceToken: []
      responses:
        '200':
          description: No-store body-free incomplete coverage inventory.
          headers:
            Cache-Control:
              description: Diagnostic results must not be cached.
              schema: { type: string, const: no-store }
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-profile-impact-coverage.v1.schema.json
        '400':
          description: Query parameters or a request body were supplied.
        '401':
          description: Missing, duplicate or invalid server service credential.
        '503':
          description: Server service credential is not configured.
  /internal/v1/catalog-architecture-configuration/regression-preflight:
    get:
      tags: [Catalog drafts]
      summary: Inspect source-controlled proposed architecture settings regression
      operationId: getSyntheticArchitectureConfigurationRegressionCheck
      description: >-
        Internal local-only read requiring the server service credential. Accepts
        no query, body, caller profiles or completeness assertions. Checks 252
        explicit synthetic designs across four unchanged frozen v5 profiles, five
        patterns and three client-context variants. Independently verifies expected
        outcomes for missing, unknown, reference, mismatched and native-loopback
        settings without hiding the separate saved-input preflight. Returns only
        no-store metadata, digests, counts and deferred boundaries, not fixture
        bodies or identity. Does not inspect IdP configuration, compare proposed
        catalogs, store receipts or change legacy coverage/publication gates.
      security:
        - BffServiceToken: []
      responses:
        '200':
          description: Body-free synthetic design regression; verification and authority remain false.
          headers:
            Cache-Control:
              description: Diagnostic results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-architecture-configuration-regression-check.v1.schema.json
        '400':
          description: A body or query was supplied to this input-free read.
        '401':
          description: Missing, duplicate or invalid service credential.
        '503':
          description: Server service credential is not configured.
  /internal/v1/catalog-auditability/regression-preflight:
    get:
      tags: [Catalog drafts]
      summary: Inspect fresh synthetic scoped auditability regression
      operationId: getSyntheticAuditabilityRegressionCheck
      description: >-
        Local-only internal read requiring the server service credential. Takes no
        body, query parameters, user profile or caller completeness assertion.
        Uses explicit supplemental requirements bound to four frozen scoped profiles
        and the separate dated synthetic evidence sidecar. Returns only digests,
        counts, exercised criteria and deferred boundaries, never source/profile
        bodies or actor identity. Does not compare proposed catalogs, store a receipt,
        refresh observations or change existing impact coverage/publication gates.
        Capability matches are not verified logging, compliance or recommendations.
      security:
        - BffServiceToken: []
      responses:
        '200':
          description: No-store body-free fixture regression inventory; full coverage and authority remain false.
          headers:
            Cache-Control:
              description: Diagnostic results must not be cached.
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-auditability-regression-check.v1.schema.json
        '400':
          description: A body or query parameters were supplied to this input-free read.
        '401':
          description: Missing, duplicate or invalid server service credential.
        '503':
          description: Server service credential is not configured.
  /api/v1/catalog-bootstrap-reviews:
    post:
      tags: [Catalog drafts]
      summary: Record a distinct whole-candidate manual bootstrap source review
      operationId: recordCatalogBootstrapSourceReview
      description: >-
        BFF-to-Core only, requiring a fresh scoped curator assertion. Every recorded
        candidate fact requires exactly one explicit human verdict and a separate
        MANUAL_BOOTSTRAP_SOURCE_REVIEW confirmation. Core verifies the full candidate
        digest and target set, then atomically stores an immutable review and body-free
        audit. No source is fetched or independently verified. Stale/future evidence
        can be reviewed but is not refreshed or made publishable. A new review requires
        an empty publication registry; exact retries by the same actor remain possible
        after publication with fresh authorization. Canonical typed arrays are unordered.
        Changed observations/candidate or another actor must use a fresh UUID. This is
        not approval, a proposal revision, a published root or catalog activation.
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-bootstrap-review-request.v1.schema.json
      responses:
        '201':
          description: New manual assertion with an atomic audit, never publication.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-bootstrap-review.v1.schema.json
        '200':
          description: Equivalent retry by the same actor; original receipt retained.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-bootstrap-review.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Missing or invalid server credential or OIDC principal.
        '403':
          description: Curator role, scope or recent authentication missing.
        '409':
          description: Nonempty publication registry, conflicting review key, or unreadable stored review.
        '503':
          description: Curator scope or server credential is not configured.
  /api/v1/catalog-bootstrap-reviews/{reviewId}:
    get:
      tags: [Catalog drafts]
      summary: Read an exact immutable bootstrap source review receipt
      operationId: getCatalogBootstrapSourceReview
      description: >-
        Fresh scoped curator assertion required. Pins UUID and review SHA-256 together,
        strictly validates stored format, hashes, target set and historical audit binding,
        and returns only a body-free receipt. No latest or catalog-label fallback,
        evidence refresh, source verification, approval or registry write occurs.
        Self-consistent administrator assertions are not proof of an authenticated publication.
      security:
        - BffServiceToken: []
      parameters:
        - name: reviewId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: expectedSha256
          in: query
          required: true
          schema: { type: string, pattern: '^[a-f0-9]{64}$' }
      responses:
        '200':
          description: Original manual source-review receipt without actor or source bodies.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-bootstrap-review.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Missing or invalid server credential or OIDC principal.
        '403':
          description: Curator role, scope or recent authentication missing.
        '404':
          description: The requested review does not exist.
        '409':
          description: Exact digest mismatch or invalid stored format/integrity assertions.
        '503':
          description: Curator scope or server credential is not configured.
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/evidence-review:
    get:
      tags: [Catalog drafts]
      summary: Review recorded evidence for all candidate facts in one exact revision
      operationId: getCatalogProposalEvidencePage
      description: >-
        BFF-to-Core only with a fresh scoped curator assertion. Verifies the stored
        request digest, then applies current Core date policy to every recorded candidate
        fact, including unchanged facts. Returns 20 rows ordered by optionId and path,
        plus counts for the entire candidate. The v2 response includes the exact typed
        claim beside its provenance. Sources and conditions are caller-supplied
        text; no source is fetched or verified and no decision or catalog write occurs.
        Missing facts remain unknown. Each page has its own evaluatedAt instant.
      security:
        - BffServiceToken: []
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/CatalogProposalVersion'
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, maximum: 6800, default: 0 }
      responses:
        '200':
          description: Unverified candidate evidence and current observation-date counts.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-proposal-evidence-page.v2.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Missing or invalid server credential or OIDC principal.
        '403':
          description: Curator role, scope or recent authentication missing.
        '404':
          description: The requested proposal revision does not exist.
        '409':
          description: The stored request cannot be reviewed with the current contract or digest policy.
        '503':
          description: Curator scope or server credential is not configured.
  /api/v1/catalog-change-proposals:
    get:
      tags: [Catalog drafts]
      summary: List bounded current proposal summaries for scoped curator review
      operationId: listCatalogProposalsForReview
      description: >-
        BFF-to-Core only. Requires the same server credential, exact curator role/scope
        and recent authentication as a rejection. Returns at most 20 current-revision
        summaries, never the proposal body or evidence. Ordered by immutable creation
        time descending, then UUID descending; both cursor fields must be supplied
        together. A missing rejection is not an approval or source-verification state.
      security:
        - BffServiceToken: []
      parameters:
        - name: beforeCreatedAt
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: beforeId
          in: query
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Current proposal summaries and an exclusive older-page cursor.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-proposal-review-page.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Missing or invalid server credential or OIDC principal.
        '403':
          description: Curator role, scope or recent authentication missing.
        '503':
          description: Curator scope or server credential is not configured.
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-reports:
    get:
      tags: [Catalog drafts]
      summary: List historical scenario reports for one exact proposal revision
      operationId: listCatalogImpactReports
      description: >-
        Local-only, read-only, unauthenticated historical data. Reports are immutable snapshots
        saved by an explicit non-web command, not trusted evidence or curator approval.
        Reads never rerun scenario rules, refresh timestamps or alter proposal history.
        Ordered by reportNumber ascending with an exclusive cursor; numbers may have gaps.
        The cursor is scoped to this revision, not a report count or catalog version.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/CatalogProposalVersion'
        - $ref: '#/components/parameters/ImpactAfterReportNumber'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Historical local-service recording, never a fresh approval or evaluation.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-report-page.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The requested revision or report is not present in this scope.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-reports/latest:
    get:
      tags: [Catalog drafts]
      summary: Read the highest-numbered stored scenario report for one proposal revision
      operationId: getLatestCatalogImpactReport
      description: >-
        Local-only historical read, not a fresh evaluation or curator approval. The report
        is bound to the exact proposal revision; 204 means that revision has no stored
        report. A later report can exist only after another explicit local command.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/CatalogProposalVersion'
      responses:
        '200':
          description: Immutable stored report with the greatest reportNumber for this revision.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-report.v1.schema.json
        '204':
          description: This proposal revision has no stored scenario report.
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The requested proposal revision does not exist.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-reports/{reportId}:
    get:
      tags: [Catalog drafts]
