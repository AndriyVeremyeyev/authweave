openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AuthWeave Core API
  version: 1.0.0
  description: >-
    Workspace-scoped assessment boundary owned by the deterministic AuthWeave core.
    The local Phase 2 API is intentionally unauthenticated and refuses to start with a
    non-loopback server address. Workspace provisioning and every assessment operation
    require authenticated authorization before a non-local deployment. Do not expose
    this local service through a proxy or tunnel.
servers:
  - url: http://127.0.0.1:8080
    description: Local Core API
security: []
tags:
  - name: Workspaces
    description: Provisions the workspace boundary used by local development.
  - name: Assessments
    description: Creates, reads and updates identity-architecture assessments.
paths:
  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    put:
      tags:
        - Workspaces
      summary: Provision a workspace
      description: >-
        Idempotently provisions a workspace for the local Phase 2 flow. Authentication
        provisioning will own this action in a later phase.
      operationId: provisionWorkspaceV1
      responses:
        "201":
          description: Workspace created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "204":
          description: Workspace already exists.
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/workspaces/{workspaceId}/assessments:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags:
        - Assessments
      summary: Create a draft assessment
      operationId: createAssessmentV1
      responses:
        "201":
          description: Draft assessment created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags:
        - Assessments
      summary: Read an assessment
      operationId: getAssessmentV1
      responses:
        "409":
          $ref: "#/components/responses/ProfileUpgradeRequired"
        "200":
          description: Current assessment representation.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/profile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    put:
      tags:
        - Assessments
      summary: Replace an assessment profile
      description: >-
        Replaces the complete structured profile only when expectedVersion matches the
        persisted assessment version. An unchanged profile preserves status and version;
        a stale expectedVersion still conflicts. Archived assessments cannot be changed.
        A successful change atomically appends a revision and a state-change event.
        Unchanged or rejected requests append neither.
      operationId: updateAssessmentProfileV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/update-assessment-profile-request.v1.schema.json
      responses:
        "200":
          description: Current profile; version increments only when the profile changes.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidProfile"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read immutable assessment revisions
      description: >-
        Returns snapshots in ascending version order. Existing assessments begin with
        a BASELINE at their pre-migration version; earlier states are not reconstructed.
        Pagination is forward-only, not a frozen snapshot across requests. This endpoint
        shares the local-only restriction of the rest of this API.
      operationId: getAssessmentRevisionsV1
      responses:
        "409":
          $ref: "#/components/responses/ProfileUpgradeRequired"
        "200":
          description: Revision page; nextAfterVersion is null when no more rows were found.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-revision-page.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read committed assessment state-change events
      description: >-
        Returns events in ascending version order, with section names but no profile
        values. This is not a request log: no-op, failed and rejected requests do not
        produce events. Writes are attributed to SERVICE/core-api until authentication
        is implemented; migration baselines use MIGRATION/flyway-v3. Pagination is
        forward-only, not a frozen snapshot across requests.
      operationId: getAssessmentEventsV1
      responses:
        "200":
          description: Event page; nextAfterVersion is null when no more rows were found.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-event-page.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/capability-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Preview capability constraints against fictional provider plans
      description: >-
        Read-only local preflight of OIDC, SAML, OAuth2 APIs, social login, enterprise
        SSO, SCIM, JIT, group sync and MFA. It does not change the assessment status,
        version or history. MATCHES_CHECKED_REQUIREMENTS is not full provider eligibility
        or a recommendation: deferredPaths explicitly lists unassessed dimensions.
        No scoring, catalog publication, persisted evaluation or real vendor claims.
        OPTIONAL capabilities can be disabled to satisfy FORBIDDEN; MANDATORY ones cannot.
        Unreviewed, missing, future or more-than-90-day-old facts cannot establish a
        match or exclusion. UNKNOWN requirements need clarification; preferences do not
        eliminate options. Catalog version, policy version and evaluation instant are
        returned for reproducibility. Evidence URLs use reserved .invalid hosts and
        are never fetched. All data and evidence are synthetic.
      operationId: getCapabilityPreflightV1
      responses:
        "200":
          description: Partial synthetic result with checks, reason codes and explicit scope limits.
          content:
            application/json:
              schema:
                $ref: ../schemas/capability-preflight.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/eligibility-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Preview capabilities and context compatibility against fictional plans
      description: >-
        Read-only local preflight combining the existing capability policy with
        application type, every selected client and user population, tenancy and
        membership. Known context selections are required compatibility constraints;
        OTHER or UNKNOWN application type and missing context need clarification.
        An empty human population is not applied only for a machine-only client set.
        Missing, unreviewed, future or more-than-90-day-old evidence cannot establish
        support or exclusion. A fresh reviewed incompatibility takes precedence over
        missing information, but all checks remain visible. Context checks are
        independent categories, not proof that the combined configuration works.
        Hosting is a preference, not a hard constraint, and operations remain deferred.
        No workload authorization, scoring, ranking, full eligibility or recommendation.
        Does not change assessment status, version or history. Both policy versions,
        catalog version and evaluation instant are returned. Every plan and evidence
        source is synthetic; reserved .invalid evidence URLs are never fetched.
        The existing capability-preflight response shape remains unchanged.
      operationId: getEligibilityPreflightV1
      responses:
        "200":
          description: Partial synthetic capability and context checks with explicit scope limits.
          content:
            application/json:
              schema:
                $ref: ../schemas/eligibility-preflight.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/architecture-pattern-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Compare baseline client patterns and browser token handling
      description: >-
        Read-only, non-exhaustive comparison of BFF/session, server-side session,
        browser SPA Code+PKCE, native Code+PKCE and workload client credentials.
        Each pattern addresses one client type; multiple selected clients may need
        multiple patterns, not one global winner. Only client selection and browser
        token exposure minimization are checked. Listed prerequisites are not verified.
        PREFERRED preserves alternatives without scoring. REQUIRED minimization is
        not a blanket ban on browser tokens: SPA needs clarification of acceptable
        exposure, while server-side patterns keep OAuth tokens away from browser code
        if their prerequisites are met. FORBIDDEN minimization needs clarification,
        not an instruction to expose tokens. Unselected client patterns are NOT_APPLICABLE.
        Empty clients yield NEEDS_INFORMATION. Browser criteria do not assess native
        or workload token storage. Includes advantages, tradeoffs, prerequisites and
        static standards references; references are not fetched during evaluation.
        Protocol feasibility, provider compatibility, assurance, audit, residency,
        compliance and operations remain deferred. No recommendation, scoring or
        change to assessment state/history. Local-only access restrictions still apply.
      operationId: getArchitecturePatternPreflightV1
      responses:
        "200":
          description: Partial per-client pattern comparison with unverified prerequisites and explicit scope.
          content:
            application/json:
              schema:
                $ref: ../schemas/architecture-pattern-preflight.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v2/workspaces/{workspaceId}/assessments:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
    post:
      tags: [Assessments]
      summary: Create a draft with a profile v2 representation
      description: >-
        Provision the workspace through the existing v1 workspace endpoint first.
        Empty residency details mean unrecorded. The database uses the smallest lossless
        profile format; the response always projects profile v2. This API is local-only.
      operationId: createAssessmentV2
      responses:
        "201":
          description: Created assessment with empty residency details.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v2.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v2/workspaces/{workspaceId}/assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Read a current assessment as profile v2
      description: >-
        Projects legacy profiles with empty residency details without updating stored
        data, timestamps, version or history. profileSchemaVersion describes the response
        representation. The original criticality is preserved. Existing v1 reads return
        409 profile-upgrade-required when residency details cannot be represented.
      operationId: getAssessmentV2
      responses:
        "200":
          description: Current assessment with an explicit v2 profile.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v2.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v2/workspaces/{workspaceId}/assessments/{assessmentId}/profile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    put:
      tags: [Assessments]
      summary: Replace a profile including scoped country residency inputs
      description: >-
        Requires the complete profile and expectedVersion. Countries are an allowlist
        for at-rest storage of every selected data category. Empty lists are unrecorded,
        not unrestricted. Processing locations, remote access, cross-border transfers
        and compliance are not represented by this input. REQUIRED and PREFERRED retain
        their existing meaning; FORBIDDEN is not interpreted as a country denylist.
        Scoped residency evaluation is available through the v2 eligibility-preflight
        endpoint; v1 preflights continue to defer it.
        Reads/no-op saves do not rewrite old snapshots. Changes atomically append a
        versioned snapshot and security-section event. V1 writes return 409 when the
        current profile contains residency details, preventing accidental data loss.
      operationId: updateAssessmentProfileV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/update-assessment-profile-request.v2.schema.json
      responses:
        "200":
          description: Updated or unchanged assessment.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v2.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidProfile"
  /api/v2/workspaces/{workspaceId}/assessments/{assessmentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read original v1 and v2 profile snapshots
      description: >-
        Preserves each stored profile and its profileSchemaVersion without applying
        current domain validation or projecting old snapshots into a newer shape.
        Uses the same exclusive version cursor as v1. A v1 history request returns 409
        if its page contains a v2 snapshot. State-change events keep their existing v1 endpoint.
      operationId: getAssessmentRevisionsV2
      responses:
        "200":
          description: A page containing original versioned snapshots.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-revision-page.v2.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v2/workspaces/{workspaceId}/assessments/{assessmentId}/eligibility-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Check capabilities, context and scoped at-rest residency against synthetic evidence
      description: >-
        Read-only, local-only partial eligibility check. Works with both stored profile
        formats; legacy profiles have unrecorded residency details. Extends v1 capability
        and context checks with one residency check per selected data category.
        A missing scope produces an explicit unknown check for a required constraint.
        REQUIRED passes only with complete reviewed evidence inside the allowlist;
        confirmed outside storage fails even if other destinations are unknown.
        Missing, unreviewed, future or stale evidence cannot prove a match or violation.
        PREFERRED is not scored and cannot eliminate. NOT_REQUIRED imposes no constraint.
        UNKNOWN and FORBIDDEN require clarification; an allowlist is never a denylist.
        Region labels do not establish storage locations. Primary/replica storage and
        BACKUPS are distinct categories. Processing, remote access, international transfers
        and compliance are not evaluated. Any checked FAIL takes precedence without hiding
        unknown checks. recommendationReady remains false; no scores or winner are returned.
        Catalog and all three rule policies are identified, but no result is persisted.
        GET does not change the profile, lifecycle, version, timestamps or history.
      operationId: getAssessmentEligibilityPreflightV2
      responses:
        "200":
          description: Versioned partial eligibility result with scoped residency reasons and evidence.
          content:
            application/json:
              schema:
                $ref: ../schemas/eligibility-preflight.v2.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Workspace boundary for every assessment query.
      schema:
        type: string
        format: uuid
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AfterVersion:
      name: afterVersion
      in: query
      description: Exclusive version cursor. Omit to start with the earliest stored version.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    HistoryLimit:
      name: limit
      in: query
      description: Maximum number of history rows returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    Location:
      description: Relative URI of the created resource.
      schema:
        type: string
        format: uri-reference
  responses:
    ProfileUpgradeRequired:
      description: This representation cannot preserve residency details; use the corresponding v2 endpoint.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    InvalidRequest:
      description: The request body, path or query parameters are malformed or outside the documented bounds.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    WorkspaceNotFound:
      description: The workspace has not been provisioned.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    AssessmentNotFound:
      description: The assessment does not exist inside the supplied workspace.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    VersionConflict:
      description: The expected version is stale, the assessment is archived, or a legacy client must use profile API v2.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    InvalidProfile:
      description: The profile contains one or more domain contradictions.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
