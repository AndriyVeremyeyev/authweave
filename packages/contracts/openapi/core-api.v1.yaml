          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v6/workspaces/{workspaceId}/assessments/context-index:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
    get:
      tags: [Assessments]
      summary: List saved application contexts in the authenticated workspace
      description: >-
        Read-only bounded navigation data: metadata, application type, clients and
        audience populations from the same stored row snapshot. No full profiles,
        free text, evaluation results or inferred readiness. Unreadable profiles
        retain their metadata with null context. The existing metadata-only list
        contract is unchanged. Service credentials and personal workspace ownership
        are required; a cursor must belong to the same workspace.
      operationId: listAssessmentContextsV6
      security:
        - BffServiceToken: []
      parameters:
        - $ref: "#/components/parameters/AssessmentListBeforeId"
        - $ref: "#/components/parameters/AssessmentListLimit"
      responses:
        "200":
          description: Saved context summaries without profile contents.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-context-list-page.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v6/workspaces/{workspaceId}/assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Read an assessment with explicit auditability requirement inputs
      description: >-
        Legacy scope is projected as an empty selection with null minimum retention.
        Unknown is not an explicit exemption, default event set or verified logging.
        No data, timestamps, versions or historical snapshots are rewritten.
      operationId: getAssessmentV6
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Current assessment in the v6 representation.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v6.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v6/workspaces/{workspaceId}/assessments/{assessmentId}/profile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    put:
      tags: [Assessments]
      summary: Replace a profile including explicit audit criteria and minimum retention
      description: >-
        Complete profile replacement with expectedVersion. Six criteria are separately
        selectable; the existing auditability criticality applies to the selection.
        Empty scope is unresolved. Retention selection requires 1-36500 days; otherwise
        minimumRetentionDays must be explicitly null. This bound is not a compliance
        rule. Malformed inputs return 400, other domain contradictions 422.
        A real change atomically appends a minimal section-level event and lossless snapshot;
        auditability changes identify the security section, not individual profile values.
        no-op saves do not rewrite data. V1-v5 API writes cannot erase recorded scope.
        Explicit v6 clearing restores older current-profile compatibility where all
        remaining inputs fit, without rewriting earlier v6 snapshots. No provider
        evidence, observed logs, configuration verification or recommendation is produced.
      operationId: updateAssessmentProfileV6
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/update-assessment-profile-request.v6.schema.json
      responses:
        "200":
          description: Updated or unchanged assessment.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v6.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidProfile"
  /api/v6/workspaces/{workspaceId}/assessments/{assessmentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read exact mixed v1 through v6 historical profiles
      description: >-
        Preserves each original stored format with exclusive version pagination.
        No upcasting or current-domain revalidation. Older APIs reject only pages
        containing unsupported formats. Minimal events remain on the v1 endpoint.
      operationId: getAssessmentRevisionsV6
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Original immutable profile snapshots.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-revision-page.v6.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v6/workspaces/{workspaceId}/assessments/{assessmentId}/auditability-capability-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Compare saved auditability inputs against separately scoped synthetic evidence
      description: >-
        Read-only, no-store partial capability preview with the current assessment version.
        Dated evidence is bound to catalog v4 option, plan, region and explicit synthetic
        configuration. Unusable or missing evidence remains unknown. No ranking,
        live source access, deployed logging/configuration/compliance verification,
        history changes, merged eligibility or publication authority. Legacy scope
        remains unrecorded. Requires the server-only BFF credential and personal ownership.
      operationId: getAssessmentAuditabilityCapabilityPreflight
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Saved inputs, dated scoped evidence and partial capability results.
          content:
            application/json:
              schema:
                $ref: ../schemas/auditability-capability-preflight.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          description: Missing or invalid service credential or session identity assertions.
        "403":
          description: Session identity does not own this personal workspace.
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
components:
  securitySchemes:
    BffServiceToken:
      type: http
      scheme: bearer
      description: Server-only credential shared by the local BFF and Core API; never sent by the browser.
  parameters:
    CatalogProposalId:
      name: proposalId
      in: path
      required: true
      description: Identifier of a locally stored unreviewed catalog proposal.
      schema:
        type: string
        format: uuid
    CatalogProposalVersion:
      name: version
      in: path
      required: true
      description: Exact stored proposal revision, never implicit latest.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    CatalogImpactReportId:
      name: reportId
      in: path
      required: true
      description: UUID of a locally recorded immutable scenario report.
      schema:
        type: string
        format: uuid
    ImpactAfterReportNumber:
      name: afterReportNumber
      in: query
      description: Exclusive report-number cursor within this exact proposal revision.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Personal workspace identifier checked against the authenticated OIDC principal.
      schema:
        type: string
        format: uuid
    AssessmentListBeforeId:
      name: beforeId
      in: query
      description: >-
        Exclusive cursor: ID of the final item on the preceding page in this workspace.
      schema:
        type: string
        format: uuid
    AssessmentListLimit:
      name: limit
      in: query
      description: Maximum number of assessment summaries in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    OidcIssuer:
      name: X-AuthWeave-Oidc-Issuer
      in: header
      required: true
      description: Issuer from the BFF-validated ID token; server-to-server only.
      schema:
        type: string
        maxLength: 2048
    OidcSubject:
      name: X-AuthWeave-Oidc-Subject
      in: header
      required: true
      description: Subject from the BFF-validated ID token; server-to-server only.
      schema:
        type: string
        maxLength: 256
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AfterVersion:
      name: afterVersion
      in: query
      description: Exclusive version cursor. Omit to start with the earliest stored version.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    HistoryLimit:
      name: limit
      in: query
      description: Maximum number of history rows returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    Location:
      description: Relative URI of the created resource.
      schema:
        type: string
        format: uri-reference
  responses:
    CatalogProposalNotFound:
      description: No stored proposal exists for this ID.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    ProfileUpgradeRequired:
      description: This representation cannot preserve newer requirements; use the compatible v2, v3, v4 or v5 endpoint.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    InvalidRequest:
      description: The request body, path or query parameters are malformed or outside the documented bounds.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    WorkspaceNotFound:
      description: The workspace has not been provisioned.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    AssessmentNotFound:
      description: The assessment does not exist inside the supplied workspace.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    VersionConflict:
      description: The expected version is stale, the assessment is archived, or an older client must use a newer profile API.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    InvalidProfile:
      description: The profile contains one or more domain contradictions.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
