openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: AuthWeave Core API
  version: 1.0.0
  description: >-
    Workspace-scoped assessments and stateless catalog draft validation owned by the deterministic AuthWeave core.
    The local development API refuses to start with a non-loopback server address.
    Every versioned workspace route requires a server-only BFF bearer credential and
    a validated OIDC issuer/subject pair mapped to the requested personal workspace.
    Catalog draft routes remain unauthenticated and local-only. Do not expose this
    service through a proxy or tunnel; this is not a hosted authentication boundary.
servers:
  - url: http://127.0.0.1:8080
    description: Local Core API
security: []
tags:
  - name: Workspaces
    description: Provisions the workspace boundary used by local development.
  - name: Assessments
    description: Creates, reads and updates identity-architecture assessments.
  - name: Catalog drafts
    description: Validates proposed catalog data locally without approval, publication or network access.
paths:
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-reports:
    get:
      tags: [Catalog drafts]
      summary: List historical scenario reports for one exact proposal revision
      operationId: listCatalogImpactReports
      description: >-
        Local-only, read-only, unauthenticated historical data. Reports are immutable snapshots
        saved by an explicit non-web command, not trusted evidence or curator approval.
        Reads never rerun scenario rules, refresh timestamps or alter proposal history.
        Ordered by reportNumber ascending with an exclusive cursor; numbers may have gaps.
        The cursor is scoped to this revision, not a report count or catalog version.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/CatalogProposalVersion'
        - $ref: '#/components/parameters/ImpactAfterReportNumber'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: Historical local-service recording, never a fresh approval or evaluation.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-report-page.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The requested revision or report is not present in this scope.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-reports/{reportId}:
    get:
      tags: [Catalog drafts]
      summary: Read an original stored scenario report without recalculation
      operationId: getCatalogImpactReport
      description: >-
        Local-only, read-only, unauthenticated historical data. Reports are immutable snapshots
        saved by an explicit non-web command, not trusted evidence or curator approval.
        Reads never rerun scenario rules, refresh timestamps or alter proposal history.
        The report must belong to both path IDs; cross-proposal or cross-revision reads return 404.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/CatalogProposalVersion'
        - $ref: '#/components/parameters/CatalogImpactReportId'
      responses:
        '200':
          description: Historical local-service recording, never a fresh approval or evaluation.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-report.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The requested revision or report is not present in this scope.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-reports/{reportId}/event:
    get:
      tags: [Catalog drafts]
      summary: Read the minimal local-service report recording event
      operationId: getCatalogImpactReportEvent
      description: >-
        Local-only, read-only, unauthenticated historical data. Reports are immutable snapshots
        saved by an explicit non-web command, not trusted evidence or curator approval.
        Reads never rerun scenario rules, refresh timestamps or alter proposal history.
        The report must belong to both path IDs; cross-proposal or cross-revision reads return 404.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/CatalogProposalVersion'
        - $ref: '#/components/parameters/CatalogImpactReportId'
      responses:
        '200':
          description: Historical local-service recording, never a fresh approval or evaluation.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-report-event.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          description: The requested revision or report is not present in this scope.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/scenario-impact-preview:
    post:
      tags: [Catalog drafts]
      summary: Preview conditional impact across three frozen full-profile scenarios
      operationId: previewCatalogScenarioImpact
      description: >-
        Local-only, read-only comparison under assumed-true claims and applicable conditions.
        Uses complete version-5 profiles frozen from the three synthetic seeds, preserving
        unknown newer requirements. Checks capability, context, residency, human controls
        and compliance-scope uncertainty; lists deferred dimensions explicitly. Reports all
        three scenarios for each changed option, even if their checked status is unchanged.
        Affected fact paths are consumed dependencies, not all facts mentioned by the profile.
        Freshness and provenance changes do not verify the hypothetical assumption. No real
        eligibility, ranking, source fetching, storage, approval or activation occurs.
        Coverage is always incomplete. Caller-supplied profiles or scenario definitions are rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-change-preview-request.v1.schema.json
      responses:
        '200':
          description: Conditional checked-scenario comparison or a blocked run, never approval.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-scenario-impact.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/scenario-impact-preview:
    get:
      tags: [Catalog drafts]
      summary: Analyze an exact stored proposal revision against current versioned scenarios
      operationId: previewStoredCatalogScenarioImpact
      description: >-
        Verifies the selected immutable request digest and runs current versioned scenarios
        at current server time. Does not silently switch to latest, rewrite historical previews,
        save an impact artifact or advance proposal state. Storage binding is not baseline
        verification or curator authorization. Incompatible historical input returns 409;
        original history reads remain available. Local-only and unauthenticated.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - name: version
          in: path
          required: true
          description: Exact stored proposal revision; not a catalog version.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        '200':
          description: Conditional scenario comparison bound to the selected stored request.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-scenario-impact.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CatalogProposalNotFound'
        '409':
          description: Stored input cannot be replayed with the current request contract or digest policy.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/impact-preview:
    post:
      tags: [Catalog drafts]
      summary: Preview conditional effects on selected catalog rule probes
      operationId: previewCatalogRuleImpact
      description: >-
        Local-only, read-only what-if analysis of the same caller-supplied request as
        the change preview. Runs 24 versioned rule probes, not complete assessment
        scenarios or all golden cases. Values are evaluated only under the explicit
        assumption that assertions are true and conditions apply. Drafts never become
        REVIEWED facts or an active ProviderCatalog. WOULD_SATISFY/WOULD_VIOLATE are
        conditional rule outcomes, not real eligibility or recommendations. Missing
        facts remain indeterminate; preferences are not scored. Observation freshness
        is reported independently and does not validate the hypothetical assumption.
        Changed provenance or conditions still affect a probe even if its outcome is
        unchanged. Scope changes require every probe to be reconsidered. Uncovered fact
        paths are listed explicitly and coverageComplete always stays false. Invalid
        comparisons are BLOCKED with no impact run. No facts are fetched, approved or saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-change-preview-request.v1.schema.json
      responses:
        '200':
          description: Conditional selected-rule analysis or a blocked comparison, never an approval gate.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-preview.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
  /api/v1/catalog-change-proposals/{proposalId}/revisions/{version}/impact-preview:
    get:
      tags: [Catalog drafts]
      summary: Analyze an explicitly selected stored proposal revision without changing its history
      operationId: previewStoredCatalogRuleImpact
      description: >-
        Loads this exact immutable revision, verifies its request digest, and runs the
        current versioned rule probes at the current server time. A later proposal head
        cannot change the selected input. Does not modify the stored preview, persist
        an impact artifact, approve anything or confirm the supplied baseline. Readable
        historical input that cannot be replayed by current rules returns 409. Original
        history reads remain available. No caller-controlled probe definitions are accepted.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - name: version
          in: path
          required: true
          description: Exact stored proposal revision, not a catalog version or implicit latest revision.
          schema:
            type: integer
            minimum: 0
            maximum: 9007199254740991
      responses:
        '200':
          description: Conditional analysis bound to the requested revision and its verified request digest.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-impact-preview.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CatalogProposalNotFound'
        '409':
          description: Stored input cannot be replayed with the current request contract or digest policy.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
  /api/v1/catalog-change-proposals/{proposalId}:
    get:
      tags: [Catalog drafts]
      summary: Read the latest stored unreviewed proposal revision
      operationId: getCatalogProposal
      description: >-
        Loopback-only development read, not authenticated curator access. Writes are only
        available through an explicit local non-web command. Returns the immutable stored
        request and preview without recalculating freshness or trusting the supplied base.
        PROPOSED is stored in the immutable snapshot. A separate authorized rejection
        record may exist; no approval or catalog activation exists.
        The nested preview's writesPerformed=false describes the historical preview, not
        whether this proposal snapshot was persisted. Proposal versions are independent
        from catalogVersion and do not reserve a published catalog version name.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
      responses:
        '200':
          description: Latest persisted request and historical preview.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-proposal-snapshot.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CatalogProposalNotFound'
  /api/v1/catalog-change-proposals/{proposalId}/decisions/rejection:
    post:
      tags: [Catalog drafts]
      summary: Record an authenticated curator rejection of the current proposal revision
      operationId: rejectCatalogProposal
      description: >-
        BFF-to-Core only. Requires the server-only bearer credential, exact configured
        ZITADEL catalog_curator project and organization, an OIDC principal and a recent
        authentication asserted from the BFF server-side session. Core verifies the
        assertion independently. The request must match the current stored revision and
        digest; a revision may be rejected only once. The decision and minimal actor audit
        event commit atomically. This does not approve, publish or change provider facts.
        The immutable proposal snapshot remains PROPOSED; its rejection is a separate record.
      security:
        - BffServiceToken: []
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-proposal-rejection-request.v1.schema.json
      responses:
        '201':
          description: Rejection and matching audit event committed.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-proposal-rejection.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          description: Missing or invalid server credential or OIDC principal.
        '403':
          description: Curator role, scope or recent authentication missing.
        '404':
          $ref: '#/components/responses/CatalogProposalNotFound'
        '409':
          description: Revision or digest is stale, or the revision was already decided.
          content:
            application/problem+json:
              schema:
                $ref: ../schemas/core-problem.v1.schema.json
        '503':
          description: Curator scope or server credential is not configured.
  /api/v1/catalog-change-proposals/{proposalId}/revisions:
    get:
      tags: [Catalog drafts]
      summary: Read immutable proposal revisions in ascending version order
      operationId: getCatalogProposalRevisions
      description: >-
        Local-only history. afterVersion is an exclusive cursor; nextAfterVersion is null
        when no later revision was observed. Stored previews retain their original clock,
        policy and provenance, not a current source verification. No writes are performed.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/AfterVersion'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: A bounded page of stored proposal revisions.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-proposal-revision-page.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CatalogProposalNotFound'
  /api/v1/catalog-change-proposals/{proposalId}/events:
    get:
      tags: [Catalog drafts]
      summary: Read committed proposal creation and revision events
      operationId: getCatalogProposalEvents
      description: >-
        Local-only minimal events, attributed to SERVICE/core-api-local-catalog rather
        than an authenticated curator. No rationale, source text or raw proposal payload.
        No-op saves and failed transactions do not create events. This is not a record
        of authorized review decisions. afterVersion is exclusive; ordering is ascending.
      parameters:
        - $ref: '#/components/parameters/CatalogProposalId'
        - $ref: '#/components/parameters/AfterVersion'
        - $ref: '#/components/parameters/HistoryLimit'
      responses:
        '200':
          description: A bounded page of proposal write events.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-proposal-event-page.v1.schema.json
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/CatalogProposalNotFound'
  /api/v1/catalog-change-proposals/preview:
    post:
      tags: [Catalog drafts]
      summary: Preview an unreviewed catalog change proposal and its semantic diff
      operationId: previewCatalogChangeProposal
      description: >-
        Local-only stateless comparison of two caller-supplied draft v1 documents. Neither
        is a trusted published baseline. The expected base digest checks the supplied payload,
        not database concurrency or authority. Proposal ID and rationale are untrusted inputs;
        PROPOSED is a preview label, not a persisted workflow state. Source verification,
        baseline verification, approval, writes, evaluation readiness and impact analysis
        remain false. Invalid drafts, a base-digest mismatch or changed content reusing a
        catalogVersion block comparison; empty change lists then mean diffComputed=false.
        Otherwise compare options by ID and facts by typed relative path. Additions/removals
        show null on the absent side, not an inferred unsupported claim. Modified facts
        distinguish claims, conditions and each provenance field. Changed option scope
        requires reviewing all its facts even when their values are unchanged. Collection
        order and equivalent timestamps create no diff. A version-label-only change yields
        NO_CONTENT_CHANGES. Both validations share one reference instant; all facts stay
        UNREVIEWED. This preview performs no source fetching, publication, decision or
        persistence. It also performs no affected-assessment analysis or golden-case impact run.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/catalog-change-preview-request.v1.schema.json
      responses:
        "200":
          description: A blocked, unchanged or review-required proposal preview; never approval.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-change-preview.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/catalog-drafts/validate:
    post:
      tags: [Catalog drafts]
      summary: Validate an unreviewed provider catalog draft without saving it
      operationId: validateProviderCatalogDraft
      description: >-
        Local-only stateless dry run. No authentication, source fetching, writes or publishing.
        The draft is a separate type from the active synthetic catalog and cannot replace it.
        Every option specifies provider, product, plan, deployment, region and configuration;
        each proposed fact has explicit conditions, source URL, observation time and a bounded
        paraphrase. Review status cannot be supplied by the caller. All facts remain UNREVIEWED.
        A current observation is not approval; the initial freshness window is 90 days inclusive.
        Missing facts remain unknown, not unsupported. Structural errors return 400. Duplicate
        identities/scopes, empty options and inconsistent residency/control claims produce
        INVALID_DRAFT with stable issue codes. VALID_DRAFT proves neither source authenticity,
        truth, completeness nor eligibility. The content digest identifies supplied data only,
        not the remote page, a published version or a cryptographic signature. Canonicalization
        sorts object keys and all v1 unordered collections, preserving text and normalizing
        timestamps to instants. Version uniqueness and durable pinning are not implemented.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/provider-catalog-draft.v1.schema.json
      responses:
        "200":
          description: Validation report; approvalGranted, writesPerformed and evaluationReady remain false.
          content:
            application/json:
              schema:
                $ref: ../schemas/catalog-draft-validation.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/workspaces/{workspaceId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
    put:
      tags:
        - Workspaces
      summary: Provision a workspace
      description: >-
        Legacy idempotent provisioning operation. The ownership guard now restricts
        it to an already mapped personal workspace, so first-login creation uses
        the credential-protected internal BFF route.
      operationId: provisionWorkspaceV1
      security:
        - BffServiceToken: []
      responses:
        "201":
          description: Workspace created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
        "204":
          description: Workspace already exists.
        "400":
          $ref: "#/components/responses/InvalidRequest"
  /api/v1/workspaces/{workspaceId}/assessments:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
    post:
      tags:
        - Assessments
      summary: Create a draft assessment
      operationId: createAssessmentV1
      security:
        - BffServiceToken: []
      responses:
        "201":
          description: Draft assessment created.
          headers:
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags:
        - Assessments
      summary: Read an assessment
      operationId: getAssessmentV1
      security:
        - BffServiceToken: []
      responses:
        "409":
          $ref: "#/components/responses/ProfileUpgradeRequired"
        "200":
          description: Current assessment representation.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/profile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    put:
      tags:
        - Assessments
      summary: Replace an assessment profile
      description: >-
        Replaces the complete structured profile only when expectedVersion matches the
        persisted assessment version. An unchanged profile preserves status and version;
        a stale expectedVersion still conflicts. Archived assessments cannot be changed.
        A successful change atomically appends a revision and a state-change event.
        Unchanged or rejected requests append neither.
      operationId: updateAssessmentProfileV1
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/update-assessment-profile-request.v1.schema.json
      responses:
        "200":
          description: Current profile; version increments only when the profile changes.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidProfile"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read immutable assessment revisions
      description: >-
        Returns snapshots in ascending version order. Existing assessments begin with
        a BASELINE at their pre-migration version; earlier states are not reconstructed.
        Pagination is forward-only, not a frozen snapshot across requests. This endpoint
        shares the local-only restriction of the rest of this API.
      operationId: getAssessmentRevisionsV1
      security:
        - BffServiceToken: []
      responses:
        "409":
          $ref: "#/components/responses/ProfileUpgradeRequired"
        "200":
          description: Revision page; nextAfterVersion is null when no more rows were found.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-revision-page.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/events:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read committed assessment state-change events
      description: >-
        Returns events in ascending version order, with section names but no profile
        values. This is not a request log: no-op, failed and rejected requests do not
        produce events. Writes are attributed to SERVICE/core-api until authentication
        is implemented; migration baselines use MIGRATION/flyway-v3. Pagination is
        forward-only, not a frozen snapshot across requests.
      operationId: getAssessmentEventsV1
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Event page; nextAfterVersion is null when no more rows were found.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-event-page.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v1/workspaces/{workspaceId}/assessments/{assessmentId}/capability-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Preview capability constraints against fictional provider plans
      description: >-
        Read-only local preflight of OIDC, SAML, OAuth2 APIs, social login, enterprise
        SSO, SCIM, JIT, group sync and MFA. It does not change the assessment status,
        version or history. MATCHES_CHECKED_REQUIREMENTS is not full provider eligibility
        or a recommendation: deferredPaths explicitly lists unassessed dimensions.
        No scoring, catalog publication, persisted evaluation or real vendor claims.
        OPTIONAL capabilities can be disabled to satisfy FORBIDDEN; MANDATORY ones cannot.
        Unreviewed, missing, future or more-than-90-day-old facts cannot establish a
        match or exclusion. UNKNOWN requirements need clarification; preferences do not
        eliminate options. Catalog version, policy version and evaluation instant are
        returned for reproducibility. Evidence URLs use reserved .invalid hosts and
        are never fetched. All data and evidence are synthetic.
      operationId: getCapabilityPreflightV1
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Partial synthetic result with checks, reason codes and explicit scope limits.
          content:
