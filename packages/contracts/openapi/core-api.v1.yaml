        "404":
          $ref: "#/components/responses/WorkspaceNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Read a current assessment as profile v5
      description: >-
        Projects older profiles with an empty usagePlanning object without changing records, timestamps, lock versions or history. Empty metric maps mean unknown, not zero. The response profileSchemaVersion describes this representation, not a storage migration.
      operationId: getAssessmentV5
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Current assessment with an explicit v5 profile.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v5.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/profile:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    put:
      tags: [Assessments]
      summary: Replace a profile including usage volumes and planning assumptions
      description: >-
        Replace the complete profile with expectedVersion. Usage counts require an explicit ASSUMED or OBSERVED basis and a non-negative JavaScript-safe integer. Missing metric keys remain unknown; zero must be supplied explicitly. Scope and assumptions are bounded owner-supplied text, never executable instructions. Incomplete planning inputs are allowed in drafts. No-op saves preserve data; changes append an atomic operations-section event and versioned snapshot. Older API writes cannot silently erase recorded planning inputs. Explicit v5 clearing restores the smallest lossless stored format without changing older history. No cost estimate or provider ranking is produced.
      operationId: updateAssessmentProfileV5
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/update-assessment-profile-request.v5.schema.json
      responses:
        "200":
          description: Updated or unchanged assessment.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-response.v5.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
        "409":
          $ref: "#/components/responses/VersionConflict"
        "422":
          $ref: "#/components/responses/InvalidProfile"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/revisions:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
      - $ref: "#/components/parameters/AfterVersion"
      - $ref: "#/components/parameters/HistoryLimit"
    get:
      tags: [Assessments]
      summary: Read original v1 through v5 profile snapshots
      description: >-
        Return exact mixed v1/v2/v3/v4/v5 snapshots with their original schema versions. No history projection, rewriting or current-domain validation. Older history APIs reject pages containing unsupported formats; events keep the v1 endpoint.
      operationId: getAssessmentRevisionsV5
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: A page containing original versioned snapshots.
          content:
            application/json:
              schema:
                $ref: ../schemas/assessment-revision-page.v5.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/usage-planning-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Inspect usage inputs and assumptions without estimating costs
      description: >-
        Read-only local-only input inventory, independent of the provider catalog.
        Lists four defined metrics with their units, recorded basis and value or UNKNOWN.
        Missing quantities never become zero and a client type never supplies implicit usage.
        INPUTS_RECORDED requires a nonblank scope and all four quantities; when any value is
        ASSUMED, at least one assumption must be recorded. Otherwise missingPaths explains
        NEEDS_INFORMATION. OBSERVED is an owner's assertion, not verified measurement.
        Even complete inputs do not establish pricing, free-tier eligibility, budget fit or
        operational cost. pricingEvaluated and recommendationReady remain false. This check
        does not change candidate eligibility or any assessment data. Earlier eligibility
        endpoints retain their scope and defer operational cost evaluation.
      operationId: getAssessmentUsagePlanningPreflight
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Versioned usage input inventory, not a cost quote.
          content:
            application/json:
              schema:
                $ref: ../schemas/usage-planning-preflight.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/hard-constraint-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Summarize checked synthetic hard constraints with reason codes
      description: >-
        Read-only, workspace-scoped summary of the existing v4 eligibility checks.
        EXCLUDED includes every failed checked constraint; UNRESOLVED includes missing,
        stale or unreviewed evidence and unknown assessment inputs. A failed constraint
        takes precedence without hiding remaining information gaps. A passing verdict
        means only that checked requirements pass; deferred dimensions, real provider
        evidence, scores and a final recommendation are not supplied. The synthetic
        fixture is not a published provider catalog. This call changes no assessment.
      operationId: getAssessmentHardConstraintPreflight
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Reason-coded synthetic preflight, not a provider recommendation.
          content:
            application/json:
              schema:
                $ref: ../schemas/hard-constraint-preflight.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/comparison-preflight:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    get:
      tags: [Assessments]
      summary: Compare synthetic hard-constraint results and explicit capability preferences
      description: >-
        Read-only, workspace-scoped comparison using the same checked hard constraints
        as the hard-constraint preflight. Only capabilities marked PREFERRED receive
        separate availability checks. Missing, stale, future or unreviewed facts remain
        UNKNOWN. An unavailable preference never excludes an option; a supported
        preference never rescues one excluded by a hard constraint. Preference evidence
        is from the fictional catalog. No weights, score, rank, winner or final
        recommendation are produced. Other preference dimensions remain deferred.
      operationId: getAssessmentSyntheticComparison
      security:
        - BffServiceToken: []
      responses:
        "200":
          description: Unranked synthetic comparison with explicit uncertainty.
          content:
            application/json:
              schema:
                $ref: ../schemas/synthetic-comparison.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/weighted-comparison-preview:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    post:
      tags: [Assessments]
      summary: Preview explicitly weighted synthetic capability preferences
      description: >-
        Read-only calculation; POST carries caller-provided weights and changes no state.
        Provide exactly one positive integer weight for each capability marked PREFERRED
        in this assessment, no other capabilities, and a total of 100. There are no
        default weights. A score is withheld if a hard requirement excludes the option,
        a checked hard requirement is unresolved, or any preferred capability has
        unknown or unusable evidence. Scores measure only these explicit capability
        preferences, not provider suitability. The fictional catalog and deferred
        dimensions cannot support a rank, winner, or final recommendation.
      operationId: previewAssessmentWeightedComparison
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/weighted-comparison-request.v1.schema.json
      responses:
        "200":
          description: Diagnostic score preview without ranking or recommendation.
          content:
            application/json:
              schema:
                $ref: ../schemas/weighted-comparison-preview.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
  /api/v5/workspaces/{workspaceId}/assessments/{assessmentId}/weight-sensitivity-preview:
    parameters:
      - $ref: "#/components/parameters/WorkspaceId"
      - $ref: "#/components/parameters/OidcIssuer"
      - $ref: "#/components/parameters/OidcSubject"
      - $ref: "#/components/parameters/AssessmentId"
    post:
      tags: [Assessments]
      summary: Show point changes between two explicit synthetic preference weight sets
      description: >-
        Read-only what-if preview over one assessment and catalog evidence snapshot.
        Both baseline and alternative must independently supply positive integer
        weights totaling 100 for exactly the capabilities marked PREFERRED. Neither
        set is a default. The response shows both diagnostic scores and per-capability
        point changes. Hard exclusions, unresolved checks and unknown preference
        evidence continue to withhold scores and deltas. It neither ranks nor chooses
        options, and it does not evaluate deferred dimensions or real provider facts.
      operationId: previewAssessmentWeightSensitivity
      security:
        - BffServiceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../schemas/weight-sensitivity-request.v1.schema.json
      responses:
        "200":
          description: Paired synthetic scores and point changes without ranking.
          content:
            application/json:
              schema:
                $ref: ../schemas/weight-sensitivity-preview.v1.schema.json
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/AssessmentNotFound"
components:
  securitySchemes:
    BffServiceToken:
      type: http
      scheme: bearer
      description: Server-only credential shared by the local BFF and Core API; never sent by the browser.
  parameters:
    CatalogProposalId:
      name: proposalId
      in: path
      required: true
      description: Identifier of a locally stored unreviewed catalog proposal.
      schema:
        type: string
        format: uuid
    CatalogProposalVersion:
      name: version
      in: path
      required: true
      description: Exact stored proposal revision, never implicit latest.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    CatalogImpactReportId:
      name: reportId
      in: path
      required: true
      description: UUID of a locally recorded immutable scenario report.
      schema:
        type: string
        format: uuid
    ImpactAfterReportNumber:
      name: afterReportNumber
      in: query
      description: Exclusive report-number cursor within this exact proposal revision.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      description: Personal workspace identifier checked against the authenticated OIDC principal.
      schema:
        type: string
        format: uuid
    AssessmentListBeforeId:
      name: beforeId
      in: query
      description: >-
        Exclusive cursor: ID of the final item on the preceding page in this workspace.
      schema:
        type: string
        format: uuid
    AssessmentListLimit:
      name: limit
      in: query
      description: Maximum number of assessment summaries in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    OidcIssuer:
      name: X-AuthWeave-Oidc-Issuer
      in: header
      required: true
      description: Issuer from the BFF-validated ID token; server-to-server only.
      schema:
        type: string
        maxLength: 2048
    OidcSubject:
      name: X-AuthWeave-Oidc-Subject
      in: header
      required: true
      description: Subject from the BFF-validated ID token; server-to-server only.
      schema:
        type: string
        maxLength: 256
    AssessmentId:
      name: assessmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AfterVersion:
      name: afterVersion
      in: query
      description: Exclusive version cursor. Omit to start with the earliest stored version.
      schema:
        type: integer
        minimum: 0
        maximum: 9007199254740991
    HistoryLimit:
      name: limit
      in: query
      description: Maximum number of history rows returned per page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
  headers:
    Location:
      description: Relative URI of the created resource.
      schema:
        type: string
        format: uri-reference
  responses:
    CatalogProposalNotFound:
      description: No stored proposal exists for this ID.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    ProfileUpgradeRequired:
      description: This representation cannot preserve newer requirements; use the compatible v2, v3, v4 or v5 endpoint.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    InvalidRequest:
      description: The request body, path or query parameters are malformed or outside the documented bounds.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    WorkspaceNotFound:
      description: The workspace has not been provisioned.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    AssessmentNotFound:
      description: The assessment does not exist inside the supplied workspace.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    VersionConflict:
      description: The expected version is stale, the assessment is archived, or an older client must use a newer profile API.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
    InvalidProfile:
      description: The profile contains one or more domain contradictions.
      content:
        application/problem+json:
          schema:
            $ref: ../schemas/core-problem.v1.schema.json
