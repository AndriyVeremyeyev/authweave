version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: maven
    directory: /services/core-api
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      java-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: monthly
    # Leave room for individual major updates alongside the minor/patch group.
    open-pull-requests-limit: 3
    groups:
      web-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Next.js lint plugins and the tests use the current TypeScript/ESLint APIs.
      # Upgrade these major versions together with their consumers intentionally.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      # Match the Node.js 24 runtime declared in .nvmrc and apps/web/package.json.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    commit-message:
      prefix: deps

  - package-ecosystem: pip
    directory: /services/ai-worker
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /packages/contracts
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      contract-dependencies:
        patterns:
          - "*"
    commit-message:
      prefix: deps
