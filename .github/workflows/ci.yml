name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - name: Check public artifact language
        run: python scripts/check_public_language.py
      - name: Test isolated identity configuration without starting services
        run: make check-auth-config PYTHON=python

  core-api:
    name: Core API
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTHWEAVE_POSTGRES_DB: authweave
      AUTHWEAVE_POSTGRES_ADMIN_USER: authweave_admin
      AUTHWEAVE_POSTGRES_ADMIN_PASSWORD: ci-admin-password
      AUTHWEAVE_CORE_DB_PASSWORD: ci-core-password
      AUTHWEAVE_WEB_DB_PASSWORD: ci-web-password
    defaults:
      run:
        working-directory: services/core-api
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/core-api/pom.xml
      - name: Start jOOQ code generation database
        working-directory: ${{ github.workspace }}
        run: docker compose --file infra/compose.yaml up --detach --wait
      - name: Set up Node.js for HTTP contract checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install contract dependencies
        working-directory: packages/contracts
        run: npm ci
      - name: Regenerate jOOQ sources
        run: ./mvnw --batch-mode --no-transfer-progress -Pjooq-codegen generate-sources
      - name: Verify generated jOOQ sources are current
        run: |
          generated_changes="$(git status --short -- src/generated/java)"
          if [ -n "$generated_changes" ]; then
            printf '%s\n' "$generated_changes"
            printf '%s\n' 'Generated jOOQ sources are stale. Run make generate-jooq and commit the result.'
            exit 1
          fi
      - name: Run Core API tests
        run: ./mvnw --batch-mode --no-transfer-progress test
      - name: Validate actual HTTP payloads against JSON Schema
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/validate-core-http.mjs services/core-api/target/core-http-contract-samples.json services/core-api/target/bootstrap-review-http-contract-samples.json services/core-api/target/auditability-review-http-contract-samples.json services/core-api/target/publication-preflight-http-contract-samples.json services/core-api/target/bootstrap-publication-http-contract-samples.json services/core-api/target/proposal-publication-http-contract-samples.json services/core-api/target/assessment-result-http-contract-samples.json
      - name: Validate fresh whole-decision publication coverage
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/check-decision-publication-coverage.mjs services/core-api/target/decision-publication-coverage-samples.json
      - name: Verify actual bootstrap publication proof bindings
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/check-bootstrap-publication.mjs services/core-api/target/bootstrap-publication-proof-samples.json
      - name: Verify actual first successor publication proof bindings
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/check-proposal-publication.mjs services/core-api/target/proposal-publication-proof-samples.json
      - name: Verify actual immutable owned assessment result bindings
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/check-assessment-results.mjs services/core-api/target/assessment-result-proof-samples.json
      - name: Verify all 18 actual golden engine cases and exact source bindings
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/check-decision-golden.mjs services/core-api/target/decision-core-golden-runtime-samples.json
      - name: Verify actual published-baseline proposal decision coverage
        working-directory: ${{ github.workspace }}
        run: node packages/contracts/scripts/check-published-proposal-coverage.mjs services/core-api/target/published-proposal-coverage-samples.json
      - name: Apply and replay isolated web authentication migration
        working-directory: ${{ github.workspace }}
        run: |
          for pass in 1 2; do
            for migration in apps/web/db/migrations/001_auth_sessions.sql apps/web/db/migrations/002_session_workspace.sql apps/web/db/migrations/003_session_curator_scope.sql apps/web/db/migrations/004_reauthentication_transactions.sql; do
              docker compose --file infra/compose.yaml exec -T postgres \
                psql --no-psqlrc --set=ON_ERROR_STOP=1 \
                --username "$AUTHWEAVE_POSTGRES_ADMIN_USER" \
                --dbname "$AUTHWEAVE_POSTGRES_DB" \
                < "$migration"
            done
          done
      - name: Run web authentication database integration tests
        working-directory: apps/web
        run: npm ci && npm run test:auth-db
      - name: Test three guided BFF flows against real Core HTTP and isolated PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=GuidedAssessmentBffIT test
      - name: Build isolated production web application and install Chromium
        working-directory: apps/web
        env:
          AUTHWEAVE_OIDC_ISSUER: ""
          AUTHWEAVE_OIDC_CLIENT_ID: ""
        run: npm run build && npx playwright install --with-deps chromium
      - name: Test desktop and mobile browser OIDC flows with real Core and isolated PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=GuidedAssessmentBrowserIT test
      - name: Stop jOOQ code generation database
        if: always()
        working-directory: ${{ github.workspace }}
        run: docker compose --file infra/compose.yaml down --volumes

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install web dependencies
        run: npm ci
      - name: Audit web dependencies
        run: npm audit --audit-level=moderate
      - name: Lint web application
        run: npm run lint
      - name: Test requirements preview
        run: npm test
      - name: Build web application
        run: npm run build

  ai-worker:
    name: AI Worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/ai-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: services/ai-worker/pyproject.toml
      - name: Install AI worker dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Lint AI worker
        run: python -m ruff check .
      - name: Run AI worker tests
        run: python -m pytest

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/contracts/package-lock.json
      - name: Install contract dependencies
        run: npm ci
      - name: Audit contract dependencies
        run: npm audit --audit-level=moderate
      - name: Validate contracts
        run: npm run check
      - name: Verify generated web profile contract
        run: node scripts/generate-web-profile.mjs --check
